config:
    - &server_address "ipc://server.ipc"
    - &combine_address "ipc://combiner.ipc"

node: !Node
  - !chain
    - !from .io.zmq.recv: {address: *server_address}
    - .output.dump: {prefix: "received:"}
    # - sn_combine.buffer: {size: 100}
    - server_graphics.DashBuffer: {}
    - .timing.every: {seconds: 5}
    - .tqdm.counter: {desc: 'buffered:'}
    # - .output.dump: {}

combine: !Node
    - !chain
        - !from .io.zmq.recv: {address: *combine_address}
        - .tqdm.counter: {desc: "Data received"}
        - .output.dump_to_file: {fname: "data_received.dat"}
        - .io.zmq.send: {address: *server_address}
        - !to Combine

    - !chain:Combine        
        - .combine.Buffer: {delay: 5, timeout: 600}
        - .combine.methods.Fisher
        - .tqdm.counter: {desc: "Data combined"}
        - .output.dump_to_file: {fname: "data_combined.dat"}
        - .io.zmq.send: {address: *server_address}

