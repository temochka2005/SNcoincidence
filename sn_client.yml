config:
  - &detector_id "${DETECTOR}"
  - &seconds_to_SN 30 #172800
  - &bg_level 0.5
  - &signal1 !obj:numpy.loadtxt {fname: "${SIGNAL_FILE}" }

node: !Node
    - !chain
        - !from .client.fake.sample_ts: {B: *bg_level, S: *signal1, tSN: *seconds_to_SN, tChunk: 60}
        # - .output.dump: {prefix: "sample_ts:"}
        - .client.fake.realtime: {shift: 0}
        # - .output.dump: {prefix: "realtime:"}
        - .tqdm.counter: {desc: "Data"}
        - !to [CountAna]
    - !chain:CountAna
        - .client.sigcalc.CountAna: { B: *bg_level, time_window: [0,10], dt: 0.1, tChunk_min: 1}
        - .client.setId: {id: *detector_id}
        - !to Sender
          #    - !chain:ShapeAna
          #- .client.sigcalc.ShapeAna: { B: *bg_level, S: *signal1, time_window: [0,10], dt: 0.1, tChunk_min: 1}
          #- .client.setId: {id: "ShapeAna"}
          #- !to Sender
        
    - !chain:Sender
        - .tqdm.counter: {desc: "DataBlocks"}
        - .io.zmq.send: {address: "ipc://combiner.ipc"}
